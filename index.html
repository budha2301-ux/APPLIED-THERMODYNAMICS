<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Engineering Simulations</title>
<style>
html,body{height:100%;margin:0;background:#111;font-family:sans-serif}
#view{position:fixed;top:0;left:0;right:0;bottom:52px;width:100%;height:calc(100% - 52px);border:0;background:#111}
nav{position:fixed;bottom:0;left:0;right:0;height:52px;background:#1b1b1b;border-top:1px solid #333;
 display:flex;gap:6px;justify-content:center;align-items:center;overflow-x:auto;padding:0 8px;box-sizing:border-box}
nav a{color:#ccc;text-decoration:none;padding:8px 14px;border-radius:6px;font-size:14px;white-space:nowrap;background:#262626}
nav a:hover{background:#333;color:#fff}
nav a.on{background:#2a6;color:#fff}
</style>
</head>
<body>
<iframe id="view" title="Simulation"></iframe>
<nav id="nav"></nav>
<script>
const DOCS=[{"title": "Conduction", "html": "<!DOCTYPE html>\n<html>\n<body style=\"margin:0;background:#111;color:#fff;font-family:sans-serif;text-align:center\">\n<h3>Conduction of Heat in a Metal Rod<\/h3>\n<canvas id=\"c\" width=\"800\" height=\"260\"><\/canvas><br>\n<button onclick=\"reset()\">Restart<\/button>\n<p>Heat flows from the hot end to the cold end as particles vibrate and collide with their neighbours.<\/p>\n<script>\nconst c=document.getElementById('c'),x=c.getContext('2d');\nconst COLS=20,ROWS=4,GAP=36,X0=60,Y0=80;\nlet P,T;\nfunction reset(){\n  P=[];T=[];\n  for(let i=0;i<COLS;i++){P.push([]);T.push(i===0?1:0);\n    for(let j=0;j<ROWS;j++)P[i].push({x:X0+i*GAP,y:Y0+j*GAP,ph:Math.random()*6});}\n}\nreset();\nfunction step(){\n  T[0]=1; // heat source\n  const n=T.slice();\n  for(let i=1;i<COLS;i++) n[i]+=0.02*(T[i-1]-T[i])+(i<COLS-1?0.02*(T[i+1]-T[i]):0);\n  T=n;\n}\nfunction draw(t){\n  step();\n  x.clearRect(0,0,800,260);\n  x.fillStyle='#333';x.fillRect(X0-25,Y0-25,COLS*GAP,ROWS*GAP+5);\n  x.font='30px sans-serif';x.fillText('\ud83d\udd25',5,Y0+60);\n  for(let i=0;i<COLS;i++)for(let j=0;j<ROWS;j++){\n    const p=P[i][j],a=2+T[i]*8;\n    const px=p.x+Math.sin(t/60*(1+T[i]*3)+p.ph)*a;\n    const py=p.y+Math.cos(t/55*(1+T[i]*3)+p.ph)*a;\n    x.fillStyle=`rgb(${60+T[i]*195},${100-T[i]*60},${255-T[i]*230})`;\n    x.beginPath();x.arc(px,py,10,0,7);x.fill();\n  }\n  x.fillStyle='#fff';x.font='14px sans-serif';\n  x.fillText('Hot end',X0,Y0+ROWS*GAP+25);\n  x.fillText('Cold end',X0+COLS*GAP-90,Y0+ROWS*GAP+25);\n  requestAnimationFrame(draw);\n}\nrequestAnimationFrame(draw);\n<\/script>\n<\/body>\n<\/html>"}, {"title": "Entropy", "html": "<!DOCTYPE html>\n<html>\n<body style=\"margin:0;background:#111;color:#fff;font-family:sans-serif;text-align:center\">\n<h3>Second Law of Thermodynamics: Entropy Increases<\/h3>\n<canvas id=\"c\" width=\"700\" height=\"300\" style=\"background:#222\"><\/canvas><br>\n<canvas id=\"g\" width=\"700\" height=\"120\" style=\"background:#1a1a1a\"><\/canvas><br>\n<button onclick=\"toggle()\">Remove / Restore Divider<\/button>\n<button onclick=\"reset()\">Restart<\/button>\n<p id=\"t\">Divider in place: hot and cold are separated (low entropy).<\/p>\n<script>\nconst c=document.getElementById('c'),x=c.getContext('2d');\nconst g=document.getElementById('g'),y=g.getContext('2d');\nconst W=700,H=300,N=80;\nlet P,wall,hist;\nfunction reset(){\n  wall=true;hist=[];P=[];\n  for(let i=0;i<N;i++){\n    const hot=i<N/2;\n    const a=Math.random()*6.28,s=hot?4:1;\n    P.push({hot,x:hot?Math.random()*330+10:Math.random()*330+360,\n      y:Math.random()*280+10,vx:Math.cos(a)*s,vy:Math.sin(a)*s});\n  }\n  document.getElementById('t').textContent='Divider in place: hot and cold are separated (low entropy).';\n}\nfunction toggle(){wall=!wall;\n  document.getElementById('t').textContent=wall?\n  'Divider restored.':'Divider removed: particles mix. Entropy rises and does not spontaneously reverse.';}\nfunction entropy(){\n  // mixing measure: fraction of hot particles in right half vs cold in left half\n  let hr=0,cl=0;\n  P.forEach(p=>{if(p.hot&&p.x>W/2)hr++;if(!p.hot&&p.x<W/2)cl++;});\n  return (hr+cl)/N; // 0 = separated, ~0.5 = fully mixed\n}\nfunction frame(){\n  x.clearRect(0,0,W,H);\n  P.forEach(p=>{\n    p.x+=p.vx;p.y+=p.vy;\n    if(p.y<8||p.y>H-8)p.vy*=-1;\n    if(p.x<8||p.x>W-8)p.vx*=-1;\n    if(wall&&((p.x<W/2&&p.x+p.vx>W/2-4)||(p.x>W/2&&p.x+p.vx<W/2+4)))p.vx*=-1;\n    x.fillStyle=p.hot?'#ff4040':'#4080ff';\n    x.beginPath();x.arc(p.x,p.y,6,0,7);x.fill();\n  });\n  if(wall){x.fillStyle='#ccc';x.fillRect(W/2-2,0,4,H);}\n  hist.push(entropy());if(hist.length>700)hist.shift();\n  y.clearRect(0,0,W,120);\n  y.strokeStyle='#0f0';y.beginPath();\n  hist.forEach((v,i)=>{const yy=110-v*2*100;i?y.lineTo(i,yy):y.moveTo(i,yy)});\n  y.stroke();\n  y.fillStyle='#fff';y.font='12px sans-serif';\n  y.fillText('Entropy (disorder) vs time',8,14);\n  requestAnimationFrame(frame);\n}\nreset();frame();\n<\/script>\n<\/body>\n<\/html>"}, {"title": "Game Theory", "html": "<!DOCTYPE html>\n<html>\n<body style=\"margin:0;background:#111;color:#fff;font-family:sans-serif;text-align:center\">\n<h3>Game Theory: The Prisoner's Dilemma<\/h3>\n<canvas id=\"c\" width=\"640\" height=\"400\" style=\"background:#1c1c1c\"><\/canvas><br>\n<button onclick=\"next()\">Next Step<\/button>\n<button onclick=\"restart()\">Restart<\/button>\n<p id=\"msg\" style=\"max-width:660px;margin:8px auto;font-size:16px;min-height:60px\"><\/p>\n<script>\nconst c=document.getElementById('c'),g=c.getContext('2d');\n// payoffs [A,B] (years in prison shown as negative)\nconst pay=[[[-1,-1],[-3,0]],   // A Cooperate: B Coop, B Defect\n           [[0,-3],[-2,-2]]];  // A Defect\nconst rows=['Cooperate','Defect'],cols=['Cooperate','Defect'];\nconst X0=170,Y0=120,W=190,H=110;\nlet step=0,pulse=0;\nconst msgs=[\n 'Two suspects are questioned separately. Each can Cooperate (stay silent) or Defect (betray). Cells show payoffs (A, B) as years in prison, so higher is better.',\n 'Step 1: If B Cooperates, what is A\\'s best reply? Defect gives 0, Cooperate gives \u22121. A\\'s best response: Defect.',\n 'Step 2: If B Defects, A compares \u22122 (Defect) with \u22123 (Cooperate). A\\'s best response: Defect. Defect is a dominant strategy for A.',\n 'Step 3: Now for B. If A Cooperates, B prefers Defect (0 vs \u22121). If A Defects, B prefers Defect (\u22122 vs \u22123). Defect is dominant for B too.',\n 'Step 4: Nash equilibrium = a cell where both players are playing a best response. That is (Defect, Defect) with payoffs (\u22122, \u22122).',\n 'The dilemma: both would be better off at (Cooperate, Cooperate) with (\u22121, \u22121), but individual incentives push them to a worse outcome.'];\n// highlights: [row,col,who]\nconst bestA=[[1,0],[1,1]], bestB=[[0,1],[1,1]];\nfunction draw(){\n  pulse+=0.08;\n  g.clearRect(0,0,640,400);g.textAlign='center';\n  g.fillStyle='#6af';g.font='bold 16px sans-serif';\n  g.fillText('Player B',X0+W,Y0-55);\n  g.save();g.translate(X0-120,Y0+H);g.rotate(-Math.PI/2);g.fillStyle='#f96';g.fillText('Player A',0,0);g.restore();\n  g.font='15px sans-serif';\n  cols.forEach((n,j)=>{g.fillStyle='#6af';g.fillText(n,X0+W/2+j*W,Y0-18);});\n  rows.forEach((n,i)=>{g.fillStyle='#f96';g.fillText(n,X0-55,Y0+H/2+i*H+5);});\n  for(let i=0;i<2;i++)for(let j=0;j<2;j++){\n    const px=X0+j*W,py=Y0+i*H;\n    g.fillStyle='#262626';g.fillRect(px,py,W,H);\n    g.strokeStyle='#888';g.lineWidth=2;g.strokeRect(px,py,W,H);\n    // best response marks\n    if(step>=1&&step<=2||step>=4){ if(bestA.some(b=>b[0]==i&&b[1]==j)&&(step>=2||(j==0))&&step!==3){\n      g.strokeStyle='#f96';g.lineWidth=5;g.strokeRect(px+4,py+4,W-8,H-8);} }\n    if(step>=3){ if(bestB.some(b=>b[0]==i&&b[1]==j)){\n      g.strokeStyle='#6af';g.lineWidth=3;g.strokeRect(px+12,py+12,W-24,H-24);} }\n    if(step>=1&&step<=2&&step===1&&i==1&&j==0){g.strokeStyle='#f96';g.lineWidth=5;g.strokeRect(px+4,py+4,W-8,H-8);}\n    g.fillStyle='#fff';g.font='bold 26px sans-serif';\n    g.fillText('('+pay[i][j][0]+', '+pay[i][j][1]+')',px+W/2,py+H/2+9);\n  }\n  if(step>=4){ // nash glow\n    const a=0.3+0.25*Math.sin(pulse);\n    g.fillStyle='rgba(0,255,100,'+a+')';g.fillRect(X0+W,Y0+H,W,H);\n    g.fillStyle='#0f0';g.font='bold 15px sans-serif';g.fillText('NASH EQUILIBRIUM',X0+1.5*W,Y0+2*H+24);\n  }\n  if(step>=5){g.fillStyle='#ff0';g.font='14px sans-serif';\n    g.fillText('Best joint outcome (not stable)',X0+W/2,Y0+2*H+24);}\n  g.font='13px sans-serif';g.textAlign='left';\n  g.fillStyle='#f96';g.fillText('\u25a0 orange = A\\'s best response',X0-100,Y0+2*H+55);\n  g.fillStyle='#6af';g.fillText('\u25a0 blue = B\\'s best response',X0+130,Y0+2*H+55);\n  requestAnimationFrame(draw);\n}\nfunction next(){if(step<5){step++;document.getElementById('msg').textContent=msgs[step];}}\nfunction restart(){step=0;document.getElementById('msg').textContent=msgs[0];}\nrestart();draw();\n<\/script>\n<\/body>\n<\/html>\n  "}, {"title": "Linear Programming", "html": "<!DOCTYPE html>\n<html>\n<body style=\"margin:0;background:#111;color:#fff;font-family:sans-serif;text-align:center\">\n<h3>Linear Programming (Graphical Method)<\/h3>\n<p>Maximize Z = 3x + 2y &nbsp;|&nbsp; x + y \u2264 4 &nbsp;|&nbsp; x + 3y \u2264 6 &nbsp;|&nbsp; x, y \u2265 0<\/p>\n<canvas id=\"c\" width=\"640\" height=\"440\" style=\"background:#1c1c1c\"><\/canvas><br>\n<button onclick=\"next()\">Next Step<\/button>\n<button onclick=\"restart()\">Restart<\/button>\n<p id=\"msg\" style=\"max-width:660px;margin:8px auto;font-size:16px;min-height:50px\"><\/p>\n<script>\nconst c=document.getElementById('c'),g=c.getContext('2d');\nconst S=60,OX=50,OY=400; // scale, origin\nconst X=v=>OX+v*S, Y=v=>OY-v*S;\nlet step=0,sweep=0,anim=null;\nconst msgs=[\n 'Step 0: Set up the axes. x \u2265 0 and y \u2265 0 restrict us to the first quadrant.',\n 'Step 1: Draw the line x + y = 4 (through (4,0) and (0,4)). Feasible side: below it.',\n 'Step 2: Draw the line x + 3y = 6 (through (6,0) and (0,2)). Feasible side: below it.',\n 'Step 3: The overlap of all constraints is the FEASIBLE REGION (shaded).',\n 'Step 4: The optimum lies at a corner point. Corners: O(0,0), A(4,0), B(3,1), C(0,2).',\n 'Step 5: Evaluate Z = 3x + 2y at each corner: O \u2192 0, A \u2192 12, B \u2192 11, C \u2192 4.',\n 'Step 6: Slide the profit line Z = 3x + 2y outward. The last corner it touches is the optimum.',\n 'Result: Maximum Z = 12 at A(4, 0).'];\nconst corners=[['O',0,0],['A',4,0],['B',3,1],['C',0,2]];\nfunction line(x1,y1,x2,y2,col,w=2){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(X(x1),Y(y1));g.lineTo(X(x2),Y(y2));g.stroke();}\nfunction draw(){\n  g.clearRect(0,0,640,440);\n  // grid\n  g.strokeStyle='#2c2c2c';g.lineWidth=1;g.font='12px sans-serif';g.fillStyle='#aaa';g.textAlign='center';\n  for(let i=0;i<=8;i++){line(i,0,i,6.5,'#2c2c2c',1);g.fillText(i,X(i),OY+16);}\n  for(let j=0;j<=6;j++){line(0,j,9,j,'#2c2c2c',1);g.fillText(j,OX-14,Y(j)+4);}\n  line(0,0,9,0,'#fff',2);line(0,0,0,6.5,'#fff',2);\n  g.fillStyle='#fff';g.fillText('x',X(9)-5,OY+30);g.fillText('y',OX-25,Y(6.5));\n  if(step>=3){g.fillStyle='rgba(80,200,120,0.35)';g.beginPath();\n    g.moveTo(X(0),Y(0));g.lineTo(X(4),Y(0));g.lineTo(X(3),Y(1));g.lineTo(X(0),Y(2));g.closePath();g.fill();}\n  if(step>=1){line(0,4,4,0,'#f66',3);g.fillStyle='#f66';g.textAlign='left';g.fillText('x + y = 4',X(1.2),Y(3.2));}\n  if(step>=2){line(0,2,6,0,'#6af',3);g.fillStyle='#6af';g.fillText('x + 3y = 6',X(4.3),Y(0.7));}\n  if(step>=4){\n    corners.forEach(([n,a,b])=>{g.fillStyle='#ff0';g.beginPath();g.arc(X(a),Y(b),6,0,7);g.fill();\n      g.fillStyle='#fff';g.textAlign='left';g.font='bold 14px sans-serif';\n      let lab=n+'('+a+','+b+')';\n      if(step>=5)lab+='  Z='+(3*a+2*b);\n      g.fillText(lab,X(a)+10,Y(b)-10);});\n  }\n  if(step>=6){ // profit line 3x+2y=z, z from 0 to sweep\n    const z=sweep;\n    line(0,z/2,z/3,0,'#fa0',3);\n    g.fillStyle='#fa0';g.font='14px sans-serif';g.textAlign='left';\n    g.fillText('Z = '+z.toFixed(1),X(z/3)+8,Y(0)-30);\n  }\n  if(step>=7){g.fillStyle='#0f0';g.beginPath();g.arc(X(4),Y(0),10,0,7);g.stroke();\n    g.strokeStyle='#0f0';g.lineWidth=3;g.beginPath();g.arc(X(4),Y(0),12,0,7);g.stroke();}\n}\nfunction next(){\n  if(step>=7)return;\n  step++;\n  document.getElementById('msg').textContent=msgs[step];\n  if(step===6){sweep=0;clearInterval(anim);\n    anim=setInterval(()=>{sweep+=0.1;if(sweep>=12){sweep=12;clearInterval(anim);}draw();},40);}\n  if(step===7){clearInterval(anim);sweep=12;}\n  draw();\n}\nfunction restart(){clearInterval(anim);step=0;sweep=0;document.getElementById('msg').textContent=msgs[0];draw();}\nrestart();\n<\/script>\n<\/body>\n<\/html>\n  "}, {"title": "Pure Substance", "html": "<!DOCTYPE html>\n<html>\n<body style=\"margin:0;background:#111;color:#fff;font-family:sans-serif;text-align:center\">\n<h3>Properties of Pure Substances: Constant-Pressure Heating of Water<\/h3>\n<canvas id=\"c\" width=\"780\" height=\"430\" style=\"background:#1c1c1c\"><\/canvas><br>\n<button onclick=\"paused=!paused\">Pause / Play<\/button>\n<button onclick=\"p=0\">Restart<\/button>\n<label> Heating progress: <input id=\"s\" type=\"range\" min=\"0\" max=\"1000\" value=\"0\" style=\"width:260px\" oninput=\"p=this.value/1000;paused=true\"><\/label>\n<p id=\"msg\" style=\"max-width:740px;margin:8px auto;font-size:16px;min-height:50px\"><\/p>\n<script>\nconst c=document.getElementById('c'),g=c.getContext('2d');\nlet p=0,paused=false;\nconst N=70;\nconst parts=[];\nfor(let i=0;i<N;i++)parts.push({x:0,y:0,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,gas:false,gx:Math.random(),gy:Math.random()});\n// schematic phase data (progress p in 0..1)\nconst vf=0.08,vg=0.55,vEnd=0.95;\nfunction state(p){\n  if(p<0.25){const f=p/0.25;return{T:20+80*f,v:vf*0.9+vf*0.1*f,x:0,name:'COMPRESSED (SUBCOOLED) LIQUID',col:'#4af',\n   txt:'State 1: Compressed liquid. T < Tsat at this pressure. Added heat raises temperature; volume barely changes.'};}\n  if(p<0.6){const f=(p-0.25)/0.35;return{T:100,v:vf+(vg-vf)*f,x:f,name:'SATURATED MIXTURE (LIQUID + VAPOR)',col:'#8cf',\n   txt:'States 2-4: Boiling at constant T = Tsat. Added heat goes into vaporization (latent heat). Quality x = mass of vapor / total mass rises from 0 to 1.'};}\n  const f=(p-0.6)/0.4;return{T:100+200*f,v:vg+(vEnd-vg)*f,x:1,name:'SUPERHEATED VAPOR',col:'#f84',\n   txt:'State 5: Superheated vapor. T > Tsat. All liquid is gone; further heat raises temperature and volume sharply.'};\n}\n// graph mapping\nconst GX0=420,GY0=370,GW=330,GH=300;\nconst gx=v=>GX0+v/1.0*GW, gy=T=>GY0-(T-0)/320*GH;\nfunction curve(){\n  g.strokeStyle='#555';g.lineWidth=1;\n  g.beginPath();g.moveTo(GX0,GY0);g.lineTo(GX0+GW,GY0);g.moveTo(GX0,GY0);g.lineTo(GX0,GY0-GH);g.stroke();\n  g.fillStyle='#aaa';g.font='13px sans-serif';g.textAlign='center';\n  g.fillText('Specific volume v \u2192',GX0+GW/2,GY0+30);\n  g.save();g.translate(GX0-45,GY0-GH/2);g.rotate(-Math.PI/2);g.fillText('Temperature T \u2192',0,0);g.restore();\n  // path\n  g.lineWidth=3;\n  for(let q=0;q<1;q+=0.005){const s=state(q),s2=state(q+0.005);\n    g.strokeStyle=s.col;g.beginPath();g.moveTo(gx(s.v),gy(s.T));g.lineTo(gx(s2.v),gy(s2.T));g.stroke();}\n  // saturation dome points\n  g.fillStyle='#fff';g.textAlign='left';\n  g.fillText('Sat. liquid (x=0)',gx(vf)-10,gy(100)+25);\n  g.textAlign='right';g.fillText('Sat. vapor (x=1)',gx(vg)+25,gy(100)-12);\n  g.textAlign='left';g.fillStyle='#8cf';g.fillText('Tsat = 100 \u00b0C (P = 101.3 kPa)',GX0+10,gy(100)-60);\n  g.strokeStyle='#8cf';g.setLineDash([4,4]);g.beginPath();g.moveTo(GX0,gy(100));g.lineTo(GX0+GW,gy(100));g.stroke();g.setLineDash([]);\n}\nconst CX=50,CW=220,CB=390,CH=300;\nfunction frame(){\n  if(!paused&&p<1)p+=0.0007;\n  if(p>1)p=1;\n  document.getElementById('s').value=p*1000;\n  const st=state(p);\n  g.clearRect(0,0,780,430);\n  // cylinder\n  const topY=CB-(40+st.v*(CH-40)/vEnd*0.95);\n  g.strokeStyle='#bbb';g.lineWidth=4;\n  g.beginPath();g.moveTo(CX,CB-CH-20);g.lineTo(CX,CB);g.lineTo(CX+CW,CB);g.lineTo(CX+CW,CB-CH-20);g.stroke();\n  // piston with weight\n  g.fillStyle='#888';g.fillRect(CX+2,topY-12,CW-4,12);\n  g.fillStyle='#555';g.fillRect(CX+CW/2-40,topY-45,80,33);\n  g.fillStyle='#fff';g.font='12px sans-serif';g.textAlign='center';g.fillText('weight',CX+CW/2,topY-24);\n  g.fillText('P = constant',CX+CW/2,topY-52);\n  // liquid\n  const liqH=40*(1-st.x)*1.0;\n  if(liqH>1){g.fillStyle='rgba(60,140,255,0.45)';g.fillRect(CX+2,CB-liqH,CW-4,liqH);}\n  // particles\n  const nLiq=Math.round(N*(1-st.x));\n  const jig=1+Math.max(0,(st.T-20))/40;\n  parts.forEach((q,i)=>{\n    const wantGas=i>=nLiq;\n    if(wantGas&&!q.gas){q.gas=true;q.x=CX+10+Math.random()*(CW-20);q.y=CB-liqH-5;}\n    if(!wantGas){q.gas=false;}\n    if(!q.gas){\n      const cols=10,r=i%cols,rw=Math.floor(i/cols);\n      const bx=CX+16+r*20,by=CB-8-rw*8;\n      q.x=bx+(Math.random()-.5)*jig;q.y=Math.max(by+(Math.random()-.5)*jig,topY+10);\n      g.fillStyle='#4af';\n    }else{\n      const sp=1.2+Math.max(0,st.T-80)/60+0.3;\n      q.x+=q.vx*sp;q.y+=q.vy*sp;\n      if(q.x<CX+6||q.x>CX+CW-6)q.vx*=-1;\n      if(q.y<topY+6){q.y=topY+6;q.vy=Math.abs(q.vy);}\n      if(q.y>CB-liqH-6){q.y=CB-liqH-6;q.vy=-Math.abs(q.vy);}\n      g.fillStyle=st.T>100?'#f84':'#9cf';\n    }\n    g.beginPath();g.arc(q.x,q.y,5,0,7);g.fill();\n  });\n  // heat source\n  const fl=0.6+0.4*Math.sin(Date.now()/80);\n  g.font=(26+4*fl)+'px sans-serif';g.textAlign='center';g.fillText('\ud83d\udd25',CX+CW/2-30,CB+35);g.fillText('\ud83d\udd25',CX+CW/2+30,CB+35);\n  g.fillStyle='#fff';g.font='bold 14px sans-serif';\n  g.fillText('Heat in (Q)',CX+CW/2,CB+52+0);\n  // readouts\n  g.textAlign='left';g.fillStyle=st.col;g.font='bold 15px sans-serif';\n  g.fillText(st.name,CX,25);\n  g.fillStyle='#fff';g.font='14px sans-serif';\n  g.fillText('T = '+st.T.toFixed(0)+' \u00b0C     Quality x = '+(st.p===undefined?st.x.toFixed(2):''),CX,48);\n  curve();\n  // moving point\n  g.fillStyle='#ff0';g.beginPath();g.arc(gx(st.v),gy(st.T),8,0,7);g.fill();\n  document.getElementById('msg').textContent=st.txt;\n  requestAnimationFrame(frame);\n}\nframe();\n<\/script>\n<\/body>\n<\/html>\n  "}, {"title": "Rankine Cycle", "html": "<!DOCTYPE html>\n<html>\n<body style=\"margin:0;background:#111;color:#fff;font-family:sans-serif;text-align:center\">\n<h3>Rankine Cycle: Four Successive Processes<\/h3>\n<canvas id=\"c\" width=\"760\" height=\"420\"><\/canvas><br>\n<button onclick=\"paused=!paused\">Pause / Play<\/button>\n<button onclick=\"jump(1)\">Next Process<\/button>\n<p id=\"info\" style=\"max-width:720px;margin:8px auto;font-size:16px\"><\/p>\n<script>\nconst c=document.getElementById('c'),x=c.getContext('2d');\nlet paused=false,t=0;\n// Corners: 1 pump outlet(bottom-left) ->2 boiler outlet(top-left) ->3 turbine outlet(top-right) ->4 condenser outlet(bottom-right)\nconst pts=[{x:140,y:340},{x:140,y:80},{x:620,y:80},{x:620,y:340}];\nconst names=['1\u21922  Pump: isentropic compression','2\u21923  Boiler: constant-pressure heat addition','3\u21924  Turbine: isentropic expansion','4\u21921  Condenser: constant-pressure heat rejection'];\nconst info=[\n 'PROCESS 1 \u2013 PUMP (1\u21922): Saturated liquid from the condenser is pumped to high pressure. Work input is small because liquid is nearly incompressible.',\n 'PROCESS 2 \u2013 BOILER (2\u21923): High-pressure liquid absorbs heat at constant pressure, heats to saturation, boils, and leaves as superheated steam.',\n 'PROCESS 3 \u2013 TURBINE (3\u21924): High-pressure steam expands through the turbine, its pressure and temperature fall, and it produces shaft work (drives the generator).',\n 'PROCESS 4 \u2013 CONDENSER (4\u21921): Low-pressure wet steam rejects heat to cooling water at constant pressure and returns to saturated liquid.'];\n// Cycle order of path: pump (left side, going up), boiler (top... ) etc.\n// Path segments: seg0 pump = bottom-left -> mid-left, seg1 boiler = left up->top, seg2 turbine=top right, seg3 condenser = right side down\nconst segs=[\n {a:{x:140,y:340},b:{x:140,y:240},st:'liquid'},   // pump region\n {a:{x:140,y:240},b:{x:300,y:80}, st:'heat'},      // boiler\n {a:{x:300,y:80},b:{x:620,y:80},  st:'steam'},     // turbine\n {a:{x:620,y:80},b:{x:620,y:340}, st:'cond'}];     // condenser\nlet cur=0,sel=null,parts=[];\nfor(let i=0;i<40;i++)parts.push(i/40);\nfunction jump(){sel=sel===null?0:(sel+1)%4;t=sel*100;}\nfunction box(px,py,w,h,label,on,col){\n  x.fillStyle=on?col:'#333';x.strokeStyle=on?'#fff':'#777';x.lineWidth=on?4:2;\n  x.fillRect(px,py,w,h);x.strokeRect(px,py,w,h);\n  x.fillStyle='#fff';x.font='bold 14px sans-serif';x.fillText(label,px+w/2,py+h/2+5);\n}\nfunction pos(u){ // u in 0..4 along path\n  const s=segs[Math.floor(u)%4],f=u%1;\n  return {x:s.a.x+(s.b.x-s.a.x)*f,y:s.a.y+(s.b.y-s.a.y)*f,st:s.st};\n}\nfunction draw(){\n  if(!paused){t+=0.6;}\n  cur=Math.floor(t/100)%4;\n  if(sel!==null&&!paused){} \n  x.clearRect(0,0,760,420);x.textAlign='center';\n  // pipes\n  x.strokeStyle='#666';x.lineWidth=6;x.beginPath();\n  x.moveTo(140,340);x.lineTo(140,240);x.lineTo(300,80);x.lineTo(620,80);x.lineTo(620,340);x.lineTo(140,340);x.stroke();\n  // components\n  box(80,250,120,60,'PUMP',cur===0,'#2a6');\n  box(160,130,110,60,'BOILER',cur===1,'#c42');\n  box(380,40,150,80,'TURBINE',cur===2,'#a82');\n  box(560,200,120,60,'CONDENSER',cur===3,'#26c');\n  // heat/work arrows\n  x.font='13px sans-serif';x.fillStyle='#f66';x.fillText('Q in \u2191 (fuel / heat)',120,115);\n  x.fillStyle='#fc6';x.fillText('W out \u2192 generator',455,28);\n  x.fillStyle='#6cf';x.fillText('Q out \u2193 (cooling water)',620,290+30);\n  x.fillStyle='#6f6';x.fillText('W in (pump motor)',80,325+25);\n  // state labels\n  x.fillStyle='#fff';x.font='bold 16px sans-serif';\n  x.fillText('1',120,355);x.fillText('2',130,235);x.fillText('3',300,65);x.fillText('4',640,150);\n  // particles\n  parts.forEach((p,i)=>{\n    const u=((p*4)+t/100*0+ (t/100))%4;\n    const q=pos(u),seg=Math.floor(u)%4;\n    let col='#4af',r=6;\n    if(seg===0){col='#4af';}\n    if(seg===1){const f=u%1;col=f<0.5?'#fa4':'#f44';r=6+f*2;}\n    if(seg===2){col='#f66';r=8-(u%1)*2;}\n    if(seg===3){const f=u%1;col=f<0.6?'#7bf':'#4af';r=7-f*1;}\n    const j=(seg===1||seg===2)?Math.sin(t/5+i)*3:0;\n    x.fillStyle=col;x.beginPath();x.arc(q.x+j,q.y+j,r,0,7);x.fill();\n  });\n  // header text\n  x.fillStyle='#ff0';x.font='bold 18px sans-serif';\n  x.fillText('Now: '+names[cur],380,215);\n  x.fillStyle='#aaa';x.font='13px sans-serif';\n  x.fillText('Blue = liquid, orange/red = vapor, light blue = wet steam condensing',380,395);\n  document.getElementById('info').textContent=info[cur];\n  requestAnimationFrame(draw);\n}\ndraw();\n<\/script>\n<\/body>\n<\/html>\n  "}];
const view=document.getElementById('view'),nav=document.getElementById('nav');
DOCS.forEach((d,i)=>{
  const a=document.createElement('a');
  a.href='#'+i;a.textContent=d.title;
  nav.appendChild(a);
});
function show(){
  let i=parseInt(location.hash.slice(1));
  if(!(i>=0&&i<DOCS.length))i=0;
  [...nav.children].forEach((a,k)=>a.classList.toggle('on',k===i));
  view.srcdoc=DOCS[i].html; // only the active simulation runs
}
window.addEventListener('hashchange',show);
show();
